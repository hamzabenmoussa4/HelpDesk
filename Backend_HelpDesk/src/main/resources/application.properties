spring.application.name=Backend_HelpDesk

# Étape configuration locale : ces valeurs par défaut visent PostgreSQL sur ce poste.
# Les variables d'environnement peuvent les remplacer dans IntelliJ, Docker ou Kubernetes.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:helpdesk_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
server.port=${SERVER_PORT:8081}

# Étape développement : JPA crée ou met à jour les tables locales à partir des entités.
# En production, cette évolution sera remplacée par des migrations de base versionnées.
spring.jpa.hibernate.ddl-auto=update

# L'API renvoie des DTO et charge les relations dans les services, pas pendant le rendu web.
spring.jpa.open-in-view=false
