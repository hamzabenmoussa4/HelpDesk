<!-- Cadre commun affiché sur toutes les pages de l'application. -->
<div class="application" [class.login-mode]="estPageLogin()">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="Accueil HelpDesk">
      <span class="brand-icon">H</span>
      <span><strong>HelpDesk</strong><small>Gestion des incidents</small></span>
    </a>
    <p class="navigation-title">ESPACE DE TRAVAIL</p>
    <nav aria-label="Navigation principale">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ><span class="nav-icon">⌂</span> Tableau de bord</a
      >
      <a routerLink="/tickets" routerLinkActive="active"><span class="nav-icon">▤</span> Tickets</a>
      <a routerLink="/categories" routerLinkActive="active"
        ><span class="nav-icon">▦</span> Catégories</a
      >
      <a routerLink="/utilisateurs" routerLinkActive="active"
        ><span class="nav-icon">♙</span> Utilisateurs</a
      >
      <a routerLink="/login" routerLinkActive="active">
        <span class="nav-icon">↪</span> Connexion
      </a>
    </nav>
    <div class="sidebar-footer">
      @if (session(); as utilisateur) {
        <span class="status-dot"></span>
        <span class="session-user"
          >{{ utilisateur.nomComplet }}<small>{{ utilisateur.role }}</small></span
        >
        <button class="logout-button" type="button" (click)="deconnecter()">Déconnexion</button>
      }
    </div>
  </aside>
  <main class="main-area">
    <header class="topbar">
      <span>HelpDesk <span class="breadcrumb-separator">/</span> {{ pageTitle() }}</span>
      <span class="environment-badge">ENVIRONNEMENT DE DÉVELOPPEMENT</span>
    </header>
    <section class="page-content"><router-outlet /></section>
  </main>
</div>
